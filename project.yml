name: daisyiOS
options:
  bundleIdPrefix: com.godmodeai
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  daisyiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/daisyiOS
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.daisyiOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OrbitDisk
        INFOPLIST_FILE: daisyiOS-Info.plist
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 8
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SP73Z8JWXM
  daisyiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/daisyiOSTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: daisyiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OrbitDiskMac:
    entitlements:
      path: Sources/daisyiOS/Resources/OrbitDisk-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/daisyiOS
        excludes: ["**/.DS_Store", "Resources/OrbitDisk-macOS.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.daisyiOS
        PRODUCT_NAME: OrbitDisk
        PRODUCT_MODULE_NAME: daisyiOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OrbitDisk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 9
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SP73Z8JWXM
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
  OrbitDiskMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/daisyiOSTests
    dependencies:
      - target: OrbitDiskMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OrbitDisk.app/Contents/MacOS/OrbitDisk"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OrbitDiskMac:
    build:
      targets:
        OrbitDiskMac: all
    test:
      targets: [OrbitDiskMacTests]
  daisyiOS:
    build:
      targets:
        daisyiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - daisyiOSTests
